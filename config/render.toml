[server]
host = "0.0.0.0"
port = 8080

[database]
path = "~/.clawrig/clawrig.db"

[agents.defaults]
model = "fast"
yolo = true

[models.fast]
provider = "openai"
model = "deepseek-v4-flash-free"
api_key_env = "OPENCODE_API_KEY"
base_url = "https://opencode.ai/zen/v1"
temperature = 0.2

[models.smart]
provider = "openai"
model = "mimo-v2.5-free"
api_key_env = "OPENCODE_API_KEY"
base_url = "https://opencode.ai/zen/v1"
temperature = 0.1

[models.groq]
provider = "openai"
model = "openai/gpt-oss-120b"
api_key_env = "GROQ_API_KEY"
base_url = "https://api.groq.com/openai/v1"
temperature = 0.2

[scheduler]
enabled = false

[heartbeat]
enabled = false