<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ClawRig</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/hint/show-hint.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1113;--surface:#171a1e;--surface2:#1f2329;--surface3:#262b32;
  --text:#e8e6e1;--text2:#9aa3ad;
  --accent:#e8a33d;--accent2:#c98a2c;--green:#7ec699;--red:#e07070;--yellow:#e6c07b;
  --radius:8px;
  --border:#2a2f36;
  --glow:0 0 18px rgba(232,163,61,.18);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --display:'Inter','Segoe UI',sans-serif;
}
html{background:var(--bg)}
body{
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  background:linear-gradient(180deg,#0f1113,#12151a 60%,#0e1012);
  color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
body>*{position:relative;z-index:1}
header{
  background:var(--surface);padding:10px 16px;display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
header h1{
  font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.04em;
  color:var(--text);display:flex;align-items:center;gap:8px;white-space:nowrap;
}
header h1 .logo{
  width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,#e8a33d,#b97a1f);
  display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:#131313;font-weight:800;
}
header h1 .sub{color:var(--text2);font-weight:500;font-size:12px;letter-spacing:.02em}
header .status{margin-left:auto;font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;font-family:var(--mono);letter-spacing:.04em;padding:5px 10px;border:1px solid var(--border);border-radius:20px;background:var(--surface2)}
#new-session{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s;white-space:nowrap}
#new-session:hover{color:var(--accent);border-color:var(--accent)}
#new-session:active{transform:scale(.97)}
header .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#layout{flex:1;display:flex;flex-direction:column;min-height:0}
#chat-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-break:break-word;animation:fadeIn .2s ease;border:1px solid transparent}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(232,163,61,.16),rgba(232,163,61,.09));color:#f4efe6;border-color:rgba(232,163,61,.45);border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:var(--surface2);font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid var(--border);border-radius:8px;max-width:90%}
.msg.error{align-self:center;background:var(--red);color:#fff;font-size:12px;border:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
/* Tool activity: single faded status lines (not chat bubbles) */
.tool-line{align-self:flex-start;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--text2);opacity:.85;line-height:1.6;max-width:95%;white-space:nowrap;overflow:hidden;animation:fadeIn .2s ease}
.tool-line .t-ico{flex-shrink:0;font-size:11px;opacity:.9}
.tool-line .t-name{color:#c8b9a0;flex-shrink:0}
.tool-line .t-path{opacity:.75;overflow:hidden;text-overflow:ellipsis}
.tool-line .t-status{flex-shrink:0;font-weight:700}
.tool-line .t-status.t-ok{color:var(--green)}
.tool-line .t-status.t-fail{color:var(--red)}
/* Model reasoning: collapsible faded block */
.thinking-block{align-self:flex-start;max-width:95%;font-family:var(--mono);font-size:11px;color:var(--text2);border-left:2px solid rgba(232,163,61,.4);padding:2px 0 2px 10px;opacity:.85;animation:fadeIn .2s ease}
.thinking-block summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.08em;color:var(--text2);user-select:none}
.thinking-block summary::-webkit-details-marker{display:none}
.thinking-block summary:hover{color:var(--text)}
.thinking-body{margin-top:4px;white-space:pre-wrap;word-break:break-word;max-height:180px;overflow-y:auto;color:#a89b85;line-height:1.55;padding-right:6px}
/* Thinking indicator: neutral ring spinner (no mascot) */
.spin-ring{width:13px;height:13px;border-radius:50%;border:2px solid rgba(232,163,61,.3);border-top-color:var(--accent);flex-shrink:0;animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.thinking-indicator{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:6px 10px;font-family:var(--mono);font-size:11px;color:var(--text2);letter-spacing:.06em;animation:fadeIn .2s ease}
/* Writing-code animation */
.code-ind{align-self:flex-start;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;padding:4px 10px;background:rgba(232,163,61,.08);border:1px solid rgba(232,163,61,.3);border-radius:8px;animation:fadeIn .2s ease}
.code-ind .code-glyph{font-weight:700;font-size:13px;color:var(--accent)}
.code-ind .code-glyph::after{content:'▍';margin-left:2px;color:var(--accent);animation:caretBlink .8s steps(1) infinite}
@keyframes caretBlink{50%{opacity:0}}
.code-ind .code-shimmer{width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(232,163,61,.9),transparent);background-size:200% 100%;animation:shimmer 1.1s linear infinite}
@keyframes shimmer{to{background-position:-200% 0}}
/* Task completion summary card */
.summary-card{align-self:flex-start;max-width:95%;background:linear-gradient(135deg,rgba(126,198,153,.09),rgba(232,163,61,.05));border:1px solid rgba(126,198,153,.35);border-radius:var(--radius);padding:10px 14px;font-size:12.5px;color:var(--text);animation:fadeIn .25s ease}
.summary-card .sum-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.05em;color:var(--green);margin-bottom:6px}
.summary-card .sum-tools{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:11.5px;color:var(--text2)}
.summary-card .sum-tools span{display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.summary-card .sum-ok{color:var(--green)}
.summary-card .sum-fail{color:var(--red)}
.summary-card .sum-note{margin-top:6px;font-size:11px;color:var(--text2);opacity:.8;font-family:var(--mono);word-break:break-word}
#input-bar{background:var(--surface);padding:12px 16px;display:flex;gap:10px;border-top:1px solid var(--border);flex-shrink:0}
#input{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:14px;outline:none;resize:none;max-height:120px;font-family:inherit;transition:border-color .15s,box-shadow .15s;caret-color:var(--accent)}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,163,61,.12)}
#input::placeholder{color:var(--text2)}
#send{background:linear-gradient(135deg,#d99a34,#b97a1f);color:#161208;border:none;border-radius:var(--radius);padding:12px 20px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.04em;transition:transform .1s,opacity .1s,box-shadow .15s}
#send:hover{box-shadow:0 0 16px rgba(232,163,61,.35)}
#send:active{transform:scale(.95)}
#send:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#cancel{display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:14px;font-weight:600;cursor:pointer}
.approval-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,rgba(245,158,11,.95),rgba(249,115,22,.95));color:#fff;padding:12px 16px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.approval-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.approval-banner .tool-name{font-weight:700;font-size:15px}
.approval-banner .tool-args{font-size:12px;opacity:.9;flex-basis:100%;font-family:var(--mono);background:rgba(0,0,0,.2);padding:6px 10px;border-radius:6px;max-height:60px;overflow:auto}
.approval-banner button{border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer}
.approval-banner .approve-btn{background:#22c55e;color:#fff}
.approval-banner .deny-btn{background:#ef4444;color:#fff}
#editor-panel{display:flex;flex-direction:column;min-height:0;height:48dvh;flex-shrink:0;background:rgba(10,15,31,.95);border-top:1px solid var(--border)}
#editor-toolbar{display:flex;gap:6px;padding:8px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(13,20,38,.8)}
#file-path{flex:1;min-width:140px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;font-family:var(--mono);caret-color:var(--accent)}
#file-path:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
#file-path::placeholder{color:var(--text2)}
#editor-toolbar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .1s,box-shadow .15s}
#editor-toolbar button:hover{opacity:.85;box-shadow:0 0 10px rgba(34,211,238,.2)}
#editor-toolbar button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#btn-save{background:linear-gradient(135deg,#059669,#10b981);border-color:rgba(52,211,153,.5)!important;color:#fff}
#btn-zip{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:rgba(167,139,250,.5)!important;color:#fff}
#editor-main{flex:1;display:flex;min-height:0}
#explorer{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:rgba(4,7,15,.55)}
#explorer-tabs{display:flex;align-items:center;gap:4px;padding:5px 8px;border-bottom:1px solid var(--border);flex-shrink:0}
.explorer-tab{background:none;border:none;color:var(--text2);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.12em;padding:3px 8px;border-radius:6px;font-family:var(--mono)}
.explorer-tab:hover{color:var(--text)}
.explorer-tab.active{background:var(--surface2);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
#explorer-refresh{margin-left:auto;background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px;line-height:1}
#explorer-refresh:hover{background:var(--surface2);color:var(--accent)}
.tree-row.dir{color:var(--text)}
.tree-row.dir::after{content:'';margin-left:auto;flex-shrink:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--text2);transition:transform .15s}
.tree-row.dir.open::after{transform:rotate(180deg)}
.pkg-head{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:13px;font-family:var(--mono);font-weight:600;cursor:pointer;color:var(--accent);border-bottom:1px solid var(--border);background:rgba(34,211,238,.04)}
.pkg-head:hover{background:var(--surface2)}
.pkg-meta{display:flex;align-items:center;gap:6px;padding:4px 10px;font-size:11px;color:var(--text2);font-family:var(--mono);flex-wrap:wrap;border-bottom:1px solid rgba(34,211,238,.08)}
.pkg-badge{background:var(--surface2);border:1px solid var(--border);color:var(--accent);border-radius:6px;padding:1px 6px;font-size:10px;font-weight:700}
.pkg-manifest{color:var(--accent);cursor:pointer;text-decoration:underline dotted}
.pkg-manifest:hover{color:var(--green)}
.pkg-label{padding:6px 10px 2px;font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--text2);font-family:var(--mono)}
.pkg-deps{display:flex;flex-direction:column;padding:0 6px 8px;border-bottom:1px solid var(--border)}
.dep-row{padding:2px 8px;font-size:12px;font-family:var(--mono);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.dep-row:hover{color:var(--text)}
.dep-row .dep-name{color:var(--text)}
.dep-row .dep-kind{color:var(--text2);opacity:.7;margin-left:6px;font-size:10px}
#explorer-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:1px;min-height:0}
#explorer-empty{padding:10px;font-size:12px;color:var(--text2);line-height:1.5}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:12.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap;color:var(--text2)}
.tree-row:hover{background:var(--surface2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.tree-row.active{background:var(--surface2);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.tree-row.touched{color:var(--text)}
.tree-row.touched::after{content:'●';color:var(--green);font-size:9px;margin-left:auto;flex-shrink:0;animation:pulse 2s infinite}
.tree-row.pulse{animation:treePulse 1.4s ease}
@keyframes treePulse{0%{background:var(--green);color:#052e16}100%{background:transparent}}
.tree-row .t-ico{flex-shrink:0;opacity:.7}
.tree-row .t-name{overflow:hidden;text-overflow:ellipsis}
#editor-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#file-status{padding:4px 10px;font-size:11px;color:var(--accent);border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0;font-family:var(--mono)}
#editor-host{flex:1;min-height:0;overflow:hidden}
#editor-host .CodeMirror{height:100%;font-family:var(--mono);font-size:13px;background:#191c21}
.cm-s-catalyst.CodeMirror{color:#d5dbe2;background:#191c21}
.cm-s-catalyst .CodeMirror-gutters{background:#14171b;border-right:1px solid var(--border);color:#3b4350}
.cm-s-catalyst .CodeMirror-linenumber{color:#545e6c}
.cm-s-catalyst .CodeMirror-cursor{border-left:2px solid var(--accent);box-shadow:0 0 8px rgba(232,163,61,.5)}
.cm-s-catalyst .CodeMirror-selected{background:rgba(232,163,61,.16)}
.cm-s-catalyst .CodeMirror-activeline-background{background:rgba(255,255,255,.03)}
.cm-s-catalyst .CodeMirror-matchingbracket{color:var(--yellow)!important;background:rgba(232,163,61,.14);outline:1px solid rgba(232,163,61,.4)}
.cm-s-catalyst span.cm-keyword{color:#e6c07b}
.cm-s-catalyst span.cm-string{color:#9ecb83}
.cm-s-catalyst span.cm-string-2{color:#8fbfa0}
.cm-s-catalyst span.cm-number{color:#d19a66}
.cm-s-catalyst span.cm-variable{color:#d5dbe2}
.cm-s-catalyst span.cm-variable-2{color:#93b8d8}
.cm-s-catalyst span.cm-variable-3{color:#a3b6cc}
.cm-s-catalyst span.cm-def{color:#61afef}
.cm-s-catalyst span.cm-property{color:#93b8d8}
.cm-s-catalyst span.cm-attribute{color:#f5a524}
.cm-s-catalyst span.cm-operator{color:#b8a6d9}
.cm-s-catalyst span.cm-comment{color:#5c6470;font-style:italic}
.cm-s-catalyst span.cm-tag{color:#e07070}
.cm-s-catalyst span.cm-type{color:#7fb8c9}
.cm-s-catalyst span.cm-atom{color:#d19a66}
.cm-s-catalyst span.cm-meta{color:#f5a524}
.cm-s-catalyst span.cm-qualifier{color:#a5b4fc}
.cm-s-catalyst span.cm-builtin{color:#9ecb83}
.cm-s-catalyst .CodeMirror-matchingtag{background:rgba(232,163,61,.14)}
/* Autocomplete dropdown */
.CodeMirror-hints{background:var(--surface3);border:1px solid var(--border);border-radius:var(--radius);font-family:var(--mono);font-size:12px;z-index:300;box-shadow:0 10px 28px rgba(0,0,0,.55)}
.CodeMirror-hint{color:var(--text2);padding:3px 10px}
.CodeMirror-hint-active{background:rgba(232,163,61,.16);color:var(--accent)}
#file-toast{position:fixed;bottom:56px;right:16px;background:var(--surface3);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text);display:none;z-index:20;max-width:320px;word-break:break-all;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#file-toast button{margin-left:8px;background:var(--accent);color:#161208;border:none;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#333a43;border-radius:5px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
/* IDE status bar */
#status-bar{display:flex;align-items:center;gap:14px;background:var(--surface);border-top:1px solid var(--border);padding:5px 16px;font-family:var(--mono);font-size:11px;color:var(--text2);flex-shrink:0;letter-spacing:.03em;user-select:none}
#status-bar .sb-item{display:flex;align-items:center;gap:6px;white-space:nowrap}
#status-bar .sb-item .sb-label{color:var(--text2);opacity:.7}
#status-bar #sb-session{cursor:pointer;border-radius:4px;padding:1px 6px;transition:background .15s,color .15s;color:var(--text2);max-width:220px;overflow:hidden;text-overflow:ellipsis}
#status-bar #sb-session:hover{background:var(--surface2);color:var(--accent)}
#status-bar #sb-session.set{color:var(--accent)}
#status-bar #sb-metrics{color:var(--text2)}
/* Desktop: IDE workspace takes the main area, chat is the right rail */
@media(min-width:900px){
  #layout{flex-direction:row}
  #chat-col{flex:0 0 340px;max-width:340px;min-width:300px;border-right:none;border-left:1px solid var(--border)}
  #editor-panel{flex:1;height:auto;min-height:0;border-top:none}
  #messages{padding:20px 18px}.msg{max-width:100%}
}
/* Mobile: stacked - chat on top, editor below, both fully usable */
@media(max-width:899px){
  #chat-col{order:-1}
  #editor-main{flex-direction:column}
  #explorer{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:140px}
  #explorer-list{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  #chat-col{min-height:0}
}
</style>
</head>
<body>
<header>
<h1><span class="logo">C</span>ClawRig<span class="sub">// agent workbench</span></h1>
<button id="new-session" title="Start a fresh session (new workspace, clean chat)">+ New session</button>
<div class="status" id="status">Connected</div>
</header>
<div id="layout">
<div id="editor-panel">
<div id="editor-toolbar">
<input id="file-path" placeholder="path/to/file (workspace root)" spellcheck="false">
<button id="btn-open" title="Open file">Open</button>
<button id="btn-save" title="Save (Ctrl+S)" disabled>Save</button>
<button id="btn-download" title="Download this file">Download</button>
<button id="btn-zip" title="Download all agent-touched files as zip">Zip</button>
</div>
<div id="editor-main">
<div id="explorer">
<div id="explorer-tabs">
<button class="explorer-tab active" id="tab-files" title="Workspace files">FILES</button>
<button class="explorer-tab" id="tab-packages" title="Project &amp; packages">PACKAGES</button>
<button id="explorer-refresh" title="Refresh">↻</button>
</div>
<div id="explorer-list"></div>
</div>
<div id="editor-col">
<div id="file-status">No file open</div>
<div id="editor-host"><textarea id="editor" spellcheck="false"></textarea></div>
</div>
</div>
</div>
<div id="chat-col">
<div id="messages"></div>
<div id="input-bar">
<textarea id="input" rows="1" placeholder="Message ClawRig..." autofocus></textarea>
<button id="cancel" style="display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer">Cancel</button>
<button id="send">Send</button>
</div>
</div>
</div>
<div id="status-bar">
<span class="sb-item"><span class="sb-label">●</span><span id="sb-status">Connected</span></span>
<span class="sb-item"><span class="sb-label">Session:</span><span id="sb-session" title="Click to copy session id">—</span></span>

<script>
const $=s=>document.querySelector(s);
const messages=$('#messages'),input=$('#input'),sendBtn=$('#send'),cancelBtn=$('#cancel'),statusEl=$('#status'),metricsEl=$('#sb-metrics'),sbSessionEl=$('#sb-session'),sbStatusEl=$('#sb-status'),sbFileEl=$('#sb-file'),newSessionBtn=$('#new-session');
let eventSource,agent='main',sending=false;
let sessionId=null;
let currentRunId=null;
let streamBubble=null;
let streamRunId=null;
let runTools=[];        // {name,path,ok} accumulated for the completion summary
let pendingToolEls={};  // run_id -> [{name,path,el}] in FIFO execution order
let reasonBox=null;     // collapsible "Thinking" block for reasoning tokens
let reasonRunId=null;
let codeInFlight=0;     // number of active file-writing tools
const approvalBanner=$('#approval-banner');
const approvalTool=$('#approval-tool');
const approvalArgs=$('#approval-args');
const approvalApprove=$('#approval-approve');
const approvalDeny=$('#approval-deny');
let currentApprovalId=null;

const filePathInput=$('#file-path');
const btnOpen=$('#btn-open');
const btnSave=$('#btn-save');
const btnDownload=$('#btn-download');
const btnZip=$('#btn-zip');
const fileStatus=$('#file-status');
const fileToast=$('#file-toast');
const explorerList=$('#explorer-list');
const explorerRefresh=$('#explorer-refresh');
let currentFilePath=null;
let dirty=false;
let touchedPaths=new Set();
let treeFiles=[];
let treeData=[];
let expandedPaths=new Set();
let packageData=[];
let explorerTab='files';
let treeTimer=null;
let toastTimer=null;

const MIMES={
  rs:'text/x-rustsrc',
  js:'text/javascript',mjs:'text/javascript',cjs:'text/javascript',json:'application/json',
  py:'text/x-python',
  sh:'text/x-sh',bash:'text/x-sh',zsh:'text/x-sh',
  toml:'text/x-toml',
  xml:'text/xml',
  html:'text/html',htm:'text/html',
  css:'text/css',
  md:'text/x-markdown',markdown:'text/x-markdown',
  yaml:'text/x-yaml',yml:'text/x-yaml',
  go:'text/x-go',
  c:'text/x-csrc',h:'text/x-csrc',cpp:'text/x-csrc',hpp:'text/x-csrc',java:'text/x-java',cs:'text/x-csharp',
  sql:'text/x-sql',
  dockerfile:'text/x-dockerfile',
  txt:null,log:null
};
function mimeForPath(p){
  const lower=(p||'').toLowerCase();
  if(lower.includes('dockerfile'))return 'text/x-dockerfile';
  const ext=lower.split('.').pop();
  return MIMES[ext]!==undefined?MIMES[ext]:null;
}
function baseName(p){return (p||'').split('/').pop()||'file';}

const editor=CodeMirror.fromTextArea($('#editor'),{
  lineNumbers:true,
  mode:null,
  theme:'catalyst',
  autoCloseBrackets:true,
  matchBrackets:true,
  styleActiveLine:true,
  indentUnit:2,
  tabSize:2,
  lineWrapping:false,
  viewportMargin:Infinity,
  hintOptions:{completeSingle:false},
  extraKeys:{
    'Ctrl-Space':'autocomplete',
    'Cmd-Space':'autocomplete',
    'Ctrl-/':'toggleComment',
    'Cmd-/':'toggleComment'
  }
});
let hintTimer=null;
editor.on('inputRead',(cm,e)=>{
  if(!e.text||e.text.length!==1)return;
  if(!/[\w.$]/.test(e.text[0]))return;
  clearTimeout(hintTimer);
  hintTimer=setTimeout(()=>{cm.showHint();},350);
});
editor.on('change',()=>{if(!dirty){dirty=true;updateSaveBtn();}});

function updateSaveBtn(){btnSave.disabled=!dirty;}
function setFileStatus(s){
  fileStatus.textContent=s;
  const v=$('#sb-file-value');if(v)v.textContent=(s||'No file open');
}
function parseArgs(a){
  if(a===null||a===undefined)return {};
  if(typeof a==='string'){try{return JSON.parse(a)||{}}catch(e){return {}}}
  return (typeof a==='object')?a:{};
}
function showFileToast(msg,action,actionPath){
  clearTimeout(toastTimer);
  fileToast.innerHTML='';
  fileToast.textContent=msg;
  if(action&&actionPath){
    const b=document.createElement('button');
    b.textContent=action;
    b.onclick=()=>{openFile(actionPath);hideFileToast();};
    fileToast.appendChild(b);
  }
  fileToast.style.display='block';
  toastTimer=setTimeout(hideFileToast,5000);
}
function hideFileToast(){fileToast.style.display='none';}

async function loadIntoEditor(path,silent){
  const r=await fetch('/api/file?'+sessQ()+'path='+encodeURIComponent(path));
  if(!r.ok){if(!silent)appendMsg('error',`Failed to load ${path} (HTTP ${r.status})`);return false;}
  const d=await r.json();
  currentFilePath=d.path||path;
  editor.setValue(d.content||'');
  editor.setOption('mode',mimeForPath(currentFilePath));
  editor.refresh();
  filePathInput.value=currentFilePath;
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · ${d.size} bytes`);
  renderTree();
  return true;
}

async function openFile(path){
  path=(path||filePathInput.value).trim();
  if(!path)return;
  if(dirty){
    if(!confirm(`Discard unsaved changes in ${currentFilePath}?`))return;
  }
  await loadIntoEditor(path);
}

async function saveFile(){
  if(!currentFilePath)return;
  const content=editor.getValue();
  const r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentFilePath,content,session:sessionId})});
  if(!r.ok){appendMsg('error',`Save failed (HTTP ${r.status})`);return;}
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · saved ${content.length} bytes`);
  touchedPaths.add(currentFilePath);
  refreshTree();
  showFileToast(`💾 Saved ${currentFilePath}`);
}

async function downloadFile(){
  if(!currentFilePath)return;
  if(dirty)await saveFile();
  const blob=new Blob([editor.getValue()],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=baseName(currentFilePath);
  a.click();
  URL.revokeObjectURL(a.href);
}

async function downloadZip(){
  if(typeof JSZip==='undefined'){appendMsg('error','JSZip not loaded (offline?)');return;}
  const zip=new JSZip();
  const names={};
  const add=(p,content)=>{const n=baseName(p);if(names[n]){names[n]++;zip.file(n.replace(/(\.[^.]+)?$/,`-${names[n]}$1`),content);}else{names[n]=1;zip.file(n,content);}};
  if(currentFilePath){
    if(dirty)await saveFile();
    add(currentFilePath,editor.getValue());
  }
  for(const p of touchedPaths){
    if(p===currentFilePath)continue;
    try{
      const r=await fetch('/api/file?'+sessQ()+'path='+encodeURIComponent(p));
      if(r.ok){const d=await r.json();add(d.path||p,d.content||'');}
    }catch(e){}
  }
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='clawrig-code-'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip';
  a.click();
  URL.revokeObjectURL(a.href);
  showFileToast('📦 Downloading zip');
}

function refreshTree(){
  clearTimeout(treeTimer);
  treeTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/files?'+sessQ());
      if(!r.ok)return;
      const d=await r.json();
      treeData=d.tree||[];
      treeFiles=(d.files||[]).map(f=>f.path).filter(Boolean);
      for(const p of touchedPaths)expandAncestors(p);
      if(currentFilePath)expandAncestors(currentFilePath);
      if(explorerTab==='files')renderTree();
    }catch(e){}
  },300);
}

function expandAncestors(path){
  const parts=(path||'').split('/');
  parts.pop();
  let acc='';
  for(const p of parts){
    if(!p)continue;
    acc=acc?acc+'/'+p:p;
    expandedPaths.add(acc);
  }
}

function toggleDir(path){
  if(expandedPaths.has(path))expandedPaths.delete(path);
  else expandedPaths.add(path);
  renderTree();
}

function treeRowFor(path){
  return explorerList.querySelector(`.tree-row[data-path="${CSS.escape(path)}"]`);
}

function fileRow(node){
  const row=document.createElement('div');
  row.className='tree-row'+(touchedPaths.has(node.path)?' touched':'');
  if(node.path===currentFilePath)row.classList.add('active');
  row.dataset.path=node.path;
  row.title=node.path;
  const ico=document.createElement('span');
  ico.className='t-ico';
  ico.textContent='📄';
  const name=document.createElement('span');
  name.className='t-name';
  name.textContent=node.name;
  row.appendChild(ico);
  row.appendChild(name);
  row.onclick=()=>openFile(node.path);
  return row;
}

function dirRow(node){
  const open=expandedPaths.has(node.path);
  const row=document.createElement('div');
  row.className='tree-row dir'+(open?' open':'');
  row.dataset.path=node.path;
  row.title=node.path;
  const ico=document.createElement('span');
  ico.className='t-ico';
  ico.textContent=open?'📂':'📁';
  const name=document.createElement('span');
  name.className='t-name';
  name.textContent=node.name;
  row.appendChild(ico);
  row.appendChild(name);
  row.onclick=()=>toggleDir(node.path);
  return row;
}

function buildNode(parent,node,depth){
  if(node.type==='dir'){
    parent.appendChild(dirRow(node));
    if(expandedPaths.has(node.path)){
      for(const child of (node.children||[]))buildNode(parent,child,depth+1);
    }
  }else{
    const row=fileRow(node);
    row.style.paddingLeft=(8+depth*14)+'px';
    parent.appendChild(row);
  }
}

function renderTree(){
  if(explorerTab!=='files')return;
  explorerList.innerHTML='';
  if(treeData.length===0){
    const empty=document.createElement('div');
    empty.id='explorer-empty';
    empty.textContent='No files yet — files the agent creates appear here.';
    explorerList.appendChild(empty);
    return;
  }
  const frag=document.createDocumentFragment();
  for(const node of treeData)buildNode(frag,node,0);
  explorerList.appendChild(frag);
}

function renderPackages(){
  if(explorerTab!=='packages')return;
  explorerList.innerHTML='';
  if(packageData.length===0){
    const empty=document.createElement('div');
    empty.id='explorer-empty';
    empty.textContent='No package manifests detected.';
    explorerList.appendChild(empty);
    return;
  }
  for(const p of packageData){
    const head=document.createElement('div');
    head.className='pkg-head';
    head.title='Open '+p.manifest;
    head.textContent=(p.icon||'📦')+' '+p.name;
    const manifestPath=(p.dir?p.dir+'/':'')+p.manifest;
    head.onclick=()=>openFile(manifestPath);

    const meta=document.createElement('div');
    meta.className='pkg-meta';
    const badge=document.createElement('span');
    badge.className='pkg-badge';
    badge.textContent=p.type_label||p.type;
    meta.appendChild(badge);
    if(p.version){const v=document.createElement('span');v.textContent='v'+p.version;meta.appendChild(v);}
    if(p.dir){const d=document.createElement('span');d.textContent='↳ '+p.dir;meta.appendChild(d);}
    const mf=document.createElement('span');
    mf.className='pkg-manifest';
    mf.textContent='📄 '+p.manifest;
    mf.onclick=(e)=>{e.stopPropagation();openFile(manifestPath);};
    meta.appendChild(mf);

    const label=document.createElement('div');
    label.className='pkg-label';
    label.textContent='DEPENDENCIES'+(p.dependencies?` (${p.dependencies.length})`:'');
    const deps=document.createElement('div');
    deps.className='pkg-deps';
    if(!p.dependencies||p.dependencies.length===0){
      deps.textContent='No dependencies';
      deps.style.padding='2px 10px 8px';
      deps.style.color='var(--text2)';
      deps.style.fontSize='12px';
    }else{
      for(const dep of p.dependencies){
        const row=document.createElement('div');
        row.className='dep-row';
        const n=document.createElement('span');
        n.className='dep-name';
        n.textContent=dep.name;
        row.appendChild(n);
        if(dep.version){const v=document.createElement('span');v.className='dep-kind';v.textContent=dep.version;row.appendChild(v);}
        if(dep.kind&&dep.kind!=='deps'&&dep.kind!=='dependencies'){const k=document.createElement('span');k.className='dep-kind';k.textContent='· '+dep.kind;row.appendChild(k);}
        row.title=dep.name+(dep.version?'@'+dep.version:'');
        deps.appendChild(row);
      }
    }

    explorerList.appendChild(head);
    explorerList.appendChild(meta);
    explorerList.appendChild(label);
    explorerList.appendChild(deps);
  }
}

async function loadPackages(){
  try{
    const r=await fetch('/api/project?'+sessQ());
    if(!r.ok)return;
    const d=await r.json();
    packageData=d.projects||[];
    if(explorerTab==='packages')renderPackages();
  }catch(e){}
}

function showExplorerTab(tab){
  explorerTab=tab;
  $('#tab-files').classList.toggle('active',tab==='files');
  $('#tab-packages').classList.toggle('active',tab==='packages');
  if(tab==='packages')renderPackages();
  else renderTree();
}

function pulseFile(path){
  const row=treeRowFor(path);
  if(!row)return;
  row.classList.remove('pulse');
  void row.offsetWidth;
  row.classList.add('pulse');
  setTimeout(()=>row.classList.remove('pulse'),1500);
}

async function agentFileChanged(path){
  if(!path)return;
  touchedPaths.add(path);
  refreshTree();
  if(path===currentFilePath){
    if(dirty){
      showFileToast('⚠️ Unsaved changes — agent changed '+path,'Open',path);
      return;
    }
    const ok=await loadIntoEditor(path,true);
    if(ok)showFileToast('↻ Agent updated '+path);
  }else if(currentFilePath===null&&editor.getValue()===''){
    await loadIntoEditor(path,true);
    pulseFile(path);
  }else{
    pulseFile(path);
    showFileToast('🧑💻 Agent wrote '+path,'Open',path);
  }
}

async function init(){
  connectSSE();
  updateSessionChip();
  refreshTree();
  loadPackages();
  updateMetrics();
  setInterval(updateMetrics,30000);
}

// The workspace is bound to the current run's session: empty until the first
// message is sent, then set to the per-run session id returned by /api/chat.
function updateSessionChip(){
  if(sessionId){
    sbSessionEl.textContent='Session: '+sessionId.slice(0,8)+'…'+sessionId.slice(-4);
    sbSessionEl.classList.add('set');
    sbSessionEl.title=sessionId+' (click to copy)';
  }else{
    sbSessionEl.textContent='Session: —';
    sbSessionEl.classList.remove('set');
    sbSessionEl.title='No active session';
  }
}

async function newSession(){
  sessionId=null;
  currentRunId=null;
  streamBubble=null;streamRunId=null;
  runTools=[];pendingToolEls={};reasonBox=null;reasonRunId=null;
  codeInFlight=0;
  messages.innerHTML='';
  currentFilePath=null;dirty=false;touchedPaths.clear();
  editor.setValue('');editor.setOption('mode',null);
  updateSaveBtn();setFileStatus('No file open');
  refreshTree();
  updateSessionChip();
  input.focus();
}

function sessQ(){
  return sessionId?('session='+encodeURIComponent(sessionId)+'&'):'';
}

function connectSSE(){
  if(eventSource)eventSource.close();
  eventSource=new EventSource('/api/events');
  eventSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='tool_call'){
        const a=parseArgs(d.args);
        const where=(a&&a.path)?a.path:(d.path||'');
        hideThinking();collapseReasoning();
        addToolLine(d.run_id||currentRunId||'run',d.name,where);
      }
      if(d.type==='tool_result'){
        const mark=d.ok===false?'❌':'✅';
        const short=(d.result||'').replace(/\s+/g,' ').slice(0,80);
        settleToolLine(d.run_id||currentRunId||'run',d.ok!==false,short);
        if(d.name==='write_file'||d.name==='edit_file'||d.name==='delete_file'){
          if(d.name==='delete_file'){
            touchedPaths.delete(d.path);
            if(d.path===currentFilePath){
              currentFilePath=null;
              editor.setValue('');
              editor.setOption('mode',null);
              dirty=false;updateSaveBtn();
              setFileStatus('No file open');
            }
            refreshTree();
          }else{
            setTimeout(()=>agentFileChanged(d.path),250);
          }
        }
      }
      if(d.type==='session.thinking'){
        // Reasoning tokens from the model -> collapsible faded block
        const box=ensureReasonBox(d.run_id||currentRunId||'run');
        const body=box.querySelector('.thinking-body');
        body.textContent=(body.textContent+d.token).slice(-3000);
        messages.scrollTop=messages.scrollHeight;
      }
      if(d.type==='session.token'){
        // Stream tokens into a live assistant bubble for this run
        hideThinking();collapseReasoning();
        if(d.run_id&&d.run_id!==streamRunId){
          streamRunId=d.run_id;
          const div=document.createElement('div');
          div.className='msg assistant';div.id='stream-bubble';
          messages.appendChild(div);
          messages.scrollTop=messages.scrollHeight;
          streamBubble=div;
          hideTyping();
        }
        if(streamBubble){
          streamBubble.textContent+=d.token;
          messages.scrollTop=messages.scrollHeight;
        }
      }
      if(d.type==='session.token_reset'&&streamBubble){
        // Retry in progress - clear the partial stream
        streamBubble.textContent='';
      }
      if(d.type==='agent_response'&&d.agent===agent){
        hideTyping();
        collapseReasoning();
        hideCodeIndicator();codeInFlight=0;
        refreshTree();
        if(!streamBubble||streamBubble.id!=='stream-bubble'||d.run_id!==streamRunId){
          // No streaming happened (or this run's bubble was closed) - show full response
          appendMsg('assistant',d.content||'');
        }else{
          // Streamed tokens already rendered; ensure bubble finalized
          if(d.content)streamBubble.textContent=d.content;
          streamBubble=null;streamRunId=null;
        }
        if(runTools.length)renderSummary(runTools,(d.content||'').slice(0,300));
        runTools=[];pendingToolEls={};
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='run_cancelled'||d.type==='run_error'){
        if(streamBubble&&d.run_id===streamRunId){streamBubble.textContent+='\n⛔ Run '+(d.type==='run_cancelled'?'cancelled':'failed')+'.';streamBubble=null;streamRunId=null;}
        resetRunIndicators();
        if(runTools.length){
          for(const t of runTools){if(t.ok===null)t.ok=false;}
          renderSummary(runTools,`${d.type==='run_cancelled'?'Run cancelled by user.':'Run failed: '+(d.error||'unknown error')}`);
        }
        runTools=[];
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='approval_needed'){
        currentApprovalId=d.approval_id;
        approvalTool.textContent=`⚙️ ${d.tool}`;
        approvalArgs.textContent=typeof d.arguments==='string'?d.arguments:JSON.stringify(d.arguments,null,2);
        approvalBanner.classList.add('show');
        hideTyping();
      }
    }catch(ex){}
  };
  eventSource.onerror=()=>{
    statusEl.textContent='Reconnecting...';
    statusEl.style.color='var(--red)';
    sbStatusEl.textContent='Reconnecting…';
    sbStatusEl.style.color='var(--red)';
    setTimeout(connectSSE,3000);
  };
  eventSource.onopen=()=>{
    statusEl.textContent='Connected';
    statusEl.style.color='var(--green)';
    sbStatusEl.textContent='Connected';
    sbStatusEl.style.color='var(--green)';
  };
}

function appendMsg(role,content){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=content;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

const CODE_TOOLS=['write_file','edit_file','delete_file'];
function isCodeTool(name){return CODE_TOOLS.includes(name);}
function toolIcon(name){
  const m={
    write_file:'📝',edit_file:'✏️',delete_file:'🗑️',read_file:'📖',list_dir:'📂',
    run_command:'🖥️',exec:'🖥️',shell:'🖥️',bash:'🖥️',
    glob:'🔍',grep:'🔍',fetch:'🌐',web_fetch:'🌐',browse:'🌐',
    todo_add:'📌',todo_update:'📌',todo_remove:'📌',todo_list:'📋',
    git:'🌿',memory:'🧠',approve:'✅'
  };
  return m[name]||'⚙️';
}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function addToolLine(runId,name,path){
  const div=document.createElement('div');
  div.className='tool-line';
  div.innerHTML=`<span class="t-ico">${toolIcon(name)}</span><span class="t-name">${esc(name)}</span><span class="t-path">${esc(path||'')}</span><span class="t-status"></span>`;
  messages.appendChild(div);
  const q=pendingToolEls[runId]=pendingToolEls[runId]||[];
  q.push({name,path,el:div});
  runTools.push({name,path,ok:null});
  if(isCodeTool(name)){codeInFlight++;showCodeIndicator();}
  messages.scrollTop=messages.scrollHeight;
}

function settleToolLine(runId,ok,short){
  const q=pendingToolEls[runId];
  if(!q||!q.length)return;
  const t=q.shift();
  if(isCodeTool(t.name)){codeInFlight=Math.max(0,codeInFlight-1);if(!codeInFlight)hideCodeIndicator();}
  const st=t.el.querySelector('.t-status');
  if(st){
    st.textContent=ok?' ✓':' ✗'+(short?' '+short:'');
    st.className='t-status '+(ok?'t-ok':'t-fail');
  }
  for(const r of runTools){if(r.name===t.name&&r.path===t.path&&r.ok===null){r.ok=ok;break;}}
}

function showThinking(){
  const div=document.createElement('div');
  div.className='thinking-indicator';div.id='thinking';
  div.innerHTML='<span class="spin-ring"></span><span>Thinking…</span>';
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function hideThinking(){
  const t=$('#thinking');if(t)t.remove();
}

function showCodeIndicator(){
  if($('#code-ind'))return;
  const div=document.createElement('div');
  div.className='code-ind';div.id='code-ind';
  div.innerHTML='<span class="code-glyph">&lt;/&gt;</span><span>Writing code</span><span class="code-shimmer"></span>';
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function hideCodeIndicator(){
  const c=$('#code-ind');if(c)c.remove();
}

function ensureReasonBox(runId){
  if(reasonBox&&reasonRunId===runId&&reasonBox.isConnected)return reasonBox;
  reasonRunId=runId;
  reasonBox=document.createElement('details');
  reasonBox.className='thinking-block';
  reasonBox.open=true;
  reasonBox.innerHTML='<summary><span class="spin-ring"></span> Thinking…</summary><div class="thinking-body"></div>';
  messages.appendChild(reasonBox);
  messages.scrollTop=messages.scrollHeight;
  return reasonBox;
}

function collapseReasoning(){
  if(reasonBox&&reasonBox.open)reasonBox.open=false;
}

function resetRunIndicators(){
  hideThinking();hideCodeIndicator();codeInFlight=0;
  pendingToolEls={};
}

function renderSummary(tools,note){
  if(!tools||!tools.length){
    hideThinking();hideCodeIndicator();return;
  }
  const okCount=tools.filter(t=>t.ok).length;
  const allOk=okCount===tools.length;
  const title=allOk
    ?`✅ Task complete — ${tools.length} step${tools.length===1?'':'s'}`
    :`⚠️ Task finished with issues — ${okCount}/${tools.length} ok`;
  let rows='';
  for(const t of tools){
    const label=esc(t.name)+(t.path?` ${esc(t.path)}`:'');
    rows+=`<span class="${t.ok?'sum-ok':'sum-fail'}">${t.ok?'✔':'✘'} ${toolIcon(t.name)} ${label}</span>`;
  }
  const card=document.createElement('div');
  card.className='summary-card';
  card.innerHTML=`<div class="sum-title">${title}</div><div class="sum-tools">${rows}</div>${note?`<div class="sum-note">${esc(note)}</div>`:''}`;
  messages.appendChild(card);
  messages.scrollTop=messages.scrollHeight;
}

function showTyping(){showThinking();}

function hideTyping(){
  hideThinking();
  const t=$('#typing');if(t)t.remove();
}

async function send(){
  if(sending||!input.value.trim())return;
  sending=true;sendBtn.disabled=true;cancelBtn.style.display='inline-block';
  runTools=[];pendingToolEls={};codeInFlight=0;reasonBox=null;reasonRunId=null;
  const msg=input.value.trim();input.value='';input.style.height='auto';
  appendMsg('user',msg);showTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,agent,peer_id:'web-user',session_id:sessionId})});
    const d=await r.json();
    if(d.session_id){sessionId=d.session_id;updateSessionChip();}
    currentRunId=d.run_id||null;
    if(!d.run_id){
      hideTyping();
      appendMsg('assistant',d.response||'');
      finishRun();
    }
  }catch(e){hideTyping();appendMsg('error','Failed to send message');finishRun();}
}

function finishRun(){
  sending=false;sendBtn.disabled=false;cancelBtn.style.display='none';
  currentRunId=null;input.focus();
}

async function cancelRun(){
  if(!currentRunId)return;
  try{
    await fetch(`/api/tasks/${currentRunId}/cancel`,{method:'POST'});
  }catch(e){appendMsg('error','Failed to cancel run');}
}

async function updateMetrics(){
  try{
    const r=await fetch('/api/metrics');const d=await r.json();
    metricsEl.textContent=`PID:${d.pid} Mem:${d.memory_kb||'?'}KB`;
    metricsEl.classList.add('show');
  }catch(e){}
}

async function handleApproval(approved){
  if(!currentApprovalId)return;
  const url=approved?'/api/approve':'/api/deny';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:currentApprovalId})});
    appendMsg('tool',approved?'✅ Approved':'❌ Denied');
  }catch(e){appendMsg('error','Failed to send approval');}
  approvalBanner.classList.remove('show');
  currentApprovalId=null;
}

approvalApprove.onclick=()=>handleApproval(true);
approvalDeny.onclick=()=>handleApproval(false);

newSessionBtn.onclick=newSession;
sbSessionEl.onclick=async()=>{
  if(!sessionId)return;
  try{
    await navigator.clipboard.writeText(sessionId);
    sbSessionEl.textContent='Session: copied ✓';
    setTimeout(updateSessionChip,1200);
  }catch(e){}
};

sendBtn.onclick=send;
cancelBtn.onclick=cancelRun;
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';};
btnOpen.onclick=()=>openFile();
btnSave.onclick=saveFile;
btnDownload.onclick=downloadFile;
btnZip.onclick=downloadZip;
explorerRefresh.onclick=()=>{refreshTree();loadPackages();};
$('#tab-files').onclick=()=>showExplorerTab('files');
$('#tab-packages').onclick=()=>showExplorerTab('packages');
filePathInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openFile();}};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    if(currentFilePath)saveFile();
  }
});
init();
</script>
