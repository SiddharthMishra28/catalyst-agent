<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ClawRig</title>
<link rel="manifest" href="/manifest.json">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f8fafc;--text2:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--red:#f87171;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--surface2);flex-shrink:0}
header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .status{margin-left:auto;font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px}
header .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.agent-select{background:var(--surface2);color:var(--text);border:1px solid var(--surface2);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-break:break-word;animation:fadeIn .2s ease}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:var(--surface2);font-family:monospace;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;max-width:90%}
.msg.error{align-self:center;background:var(--red);color:#fff;font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{align-self:flex-start;padding:8px 16px;display:flex;gap:4px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--text2);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-8px);opacity:.3}}
#input-bar{background:var(--surface);padding:12px 16px;display:flex;gap:10px;border-top:1px solid var(--surface2);flex-shrink:0}
#input{flex:1;background:var(--surface2);color:var(--text);border:none;border-radius:var(--radius);padding:12px 16px;font-size:15px;outline:none;resize:none;max-height:120px;font-family:inherit}
#input::placeholder{color:var(--text2)}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .1s}
#send:active{transform:scale(.95)}
#send:disabled{opacity:.5;cursor:not-allowed}
.metrics{position:fixed;bottom:80px;right:16px;background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);display:none;z-index:10}
.metrics.show{display:block}
.approval-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;padding:12px 16px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.approval-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.approval-banner .tool-name{font-weight:700;font-size:15px}
.approval-banner .tool-args{font-size:12px;opacity:.9;flex-basis:100%;font-family:monospace;background:rgba(0,0,0,.2);padding:6px 10px;border-radius:6px;max-height:60px;overflow:auto}
.approval-banner button{border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer}
.approval-banner .approve-btn{background:#22c55e;color:#fff}
.approval-banner .deny-btn{background:#ef4444;color:#fff}
@media(min-width:768px){#messages{padding:24px 32px}.msg{max-width:60%}}
</style>
</head>
<body>
<header>
<h1>ClawRig</h1>
<select class="agent-select" id="agent-select"><option value="main">main</option></select>
<div class="status" id="status">Connected</div>
</header>
<div id="messages"></div>
<div id="input-bar">
<textarea id="input" rows="1" placeholder="Message ClawRig..." autofocus></textarea>
<button id="cancel" style="display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer">Cancel</button>
<button id="send">Send</button>
</div>
<div class="metrics" id="metrics"></div>
<div class="approval-banner" id="approval-banner">
<span class="tool-name" id="approval-tool"></span>
<button class="approve-btn" id="approval-approve">Approve</button>
<button class="deny-btn" id="approval-deny">Deny</button>
<div class="tool-args" id="approval-args"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const messages=$('#messages'),input=$('#input'),sendBtn=$('#send'),cancelBtn=$('#cancel'),agentSelect=$('#agent-select'),statusEl=$('#status'),metricsEl=$('#metrics');
let eventSource,agent='main',sending=false;
let currentRunId=null;
let streamBubble=null;
let streamRunId=null;
const approvalBanner=$('#approval-banner');
const approvalTool=$('#approval-tool');
const approvalArgs=$('#approval-args');
const approvalApprove=$('#approval-approve');
const approvalDeny=$('#approval-deny');
let currentApprovalId=null;

async function init(){
  try{
    const r=await fetch('/api/agents');
    const agents=await r.json();
    agentSelect.innerHTML=agents.map(a=>`<option value="${a}">${a}</option>`).join('');
  }catch(e){}
  connectSSE();
  updateMetrics();
  setInterval(updateMetrics,30000);
}

function connectSSE(){
  if(eventSource)eventSource.close();
  eventSource=new EventSource('/api/events');
  eventSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='tool_call')appendMsg('tool',`🔧 ${d.name}(${d.args||''})`);
      if(d.type==='tool_result')appendMsg('tool',`✅ ${d.name}: ${d.result||''}`);
      if(d.type==='session.token'){
        // Stream tokens into a live assistant bubble for this run
        if(d.run_id&&d.run_id!==streamRunId){
          streamRunId=d.run_id;
          const div=document.createElement('div');
          div.className='msg assistant';div.id='stream-bubble';
          messages.appendChild(div);
          messages.scrollTop=messages.scrollHeight;
          streamBubble=div;
          hideTyping();
        }
        if(streamBubble){
          streamBubble.textContent+=d.token;
          messages.scrollTop=messages.scrollHeight;
        }
      }
      if(d.type==='session.token_reset'&&streamBubble){
        // Retry in progress - clear the partial stream
        streamBubble.textContent='';
      }
      if(d.type==='agent_response'&&d.agent===agent){
        hideTyping();
        if(!streamBubble||streamBubble.id!=='stream-bubble'||d.run_id!==streamRunId){
          // No streaming happened (or this run's bubble was closed) - show full response
          appendMsg('assistant',d.content||'');
        }else{
          // Streamed tokens already rendered; ensure bubble finalized
          if(d.content)streamBubble.textContent=d.content;
          streamBubble=null;streamRunId=null;
        }
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='run_cancelled'||d.type==='run_error'){
        if(streamBubble&&d.run_id===streamRunId){streamBubble.textContent+='\n⛔ Run '+(d.type==='run_cancelled'?'cancelled':'failed')+'.';streamBubble=null;streamRunId=null;}
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='approval_needed'){
        currentApprovalId=d.approval_id;
        approvalTool.textContent=`⚙️ ${d.tool}`;
        approvalArgs.textContent=typeof d.arguments==='string'?d.arguments:JSON.stringify(d.arguments,null,2);
        approvalBanner.classList.add('show');
        hideTyping();
      }
    }catch(ex){}
  };
  eventSource.onerror=()=>{
    statusEl.textContent='Reconnecting...';
    statusEl.style.color='var(--red)';
    setTimeout(connectSSE,3000);
  };
  eventSource.onopen=()=>{
    statusEl.textContent='Connected';
    statusEl.style.color='var(--green)';
  };
}

function appendMsg(role,content){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=content;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='typing';div.id='typing';
  div.innerHTML='<span></span><span></span><span></span>';
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function hideTyping(){
  const t=$('#typing');if(t)t.remove();
}

async function send(){
  if(sending||!input.value.trim())return;
  sending=true;sendBtn.disabled=true;cancelBtn.style.display='inline-block';
  const msg=input.value.trim();input.value='';input.style.height='auto';
  appendMsg('user',msg);showTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,agent,peer_id:'web-user'})});
    const d=await r.json();
    currentRunId=d.run_id||null;
    if(!d.run_id){
      hideTyping();
      appendMsg('assistant',d.response||'');
      finishRun();
    }
  }catch(e){hideTyping();appendMsg('error','Failed to send message');finishRun();}
}

function finishRun(){
  sending=false;sendBtn.disabled=false;cancelBtn.style.display='none';
  currentRunId=null;input.focus();
}

async function cancelRun(){
  if(!currentRunId)return;
  try{
    await fetch(`/api/tasks/${currentRunId}/cancel`,{method:'POST'});
  }catch(e){appendMsg('error','Failed to cancel run');}
}

async function updateMetrics(){
  try{
    const r=await fetch('/api/metrics');const d=await r.json();
    metricsEl.textContent=`PID:${d.pid} Mem:${d.memory_kb||'?'}KB`;
    metricsEl.classList.add('show');
  }catch(e){}
}

async function handleApproval(approved){
  if(!currentApprovalId)return;
  const url=approved?'/api/approve':'/api/deny';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:currentApprovalId})});
    appendMsg('tool',approved?'✅ Approved':'❌ Denied');
  }catch(e){appendMsg('error','Failed to send approval');}
  approvalBanner.classList.remove('show');
  currentApprovalId=null;
}

approvalApprove.onclick=()=>handleApproval(true);
approvalDeny.onclick=()=>handleApproval(false);

agentSelect.onchange=e=>{agent=e.target.value;messages.innerHTML='';};
sendBtn.onclick=send;
cancelBtn.onclick=cancelRun;
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';};
init();
</script>
</body>
</html>
