<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#05070f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ClawRig</title>
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#05070f;--surface:rgba(13,20,38,.92);--surface2:#16223a;
  --text:#e6f1ff;--text2:#7d93b5;
  --accent:#22d3ee;--accent2:#a78bfa;--green:#34d399;--red:#fb7185;
  --radius:10px;
  --border:rgba(34,211,238,.18);
  --glow:0 0 18px rgba(34,211,238,.25);
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --display:'Orbitron','Segoe UI',sans-serif;
}
html{background:var(--bg)}
body{
  font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;
  background:
    radial-gradient(1100px 700px at 85% -10%,rgba(34,211,238,.09),transparent 60%),
    radial-gradient(900px 650px at 0% 110%,rgba(167,139,250,.08),transparent 55%),
    linear-gradient(180deg,#05070f,#070b18 55%,#04060d);
  color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden;
}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(rgba(34,211,238,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(34,211,238,.045) 1px,transparent 1px);background-size:44px 44px}
body::after{content:'';position:fixed;left:0;right:0;top:0;height:120px;pointer-events:none;z-index:0;background:linear-gradient(180deg,transparent,rgba(34,211,238,.045),transparent);animation:scan 9s linear infinite}
@keyframes scan{0%{transform:translateY(-140px)}100%{transform:translateY(100dvh)}}
body>*{position:relative;z-index:1}
header{
  background:linear-gradient(180deg,rgba(13,20,38,.96),rgba(10,15,31,.92));
  padding:12px 18px;display:flex;align-items:center;gap:14px;
  border-bottom:1px solid var(--border);flex-shrink:0;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),97% 100%,0 100%);
}
header h1{
  font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(90deg,#22d3ee,#a78bfa,#22d3ee);background-size:200% 100%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  animation:titleShift 6s linear infinite;
}
@keyframes titleShift{to{background-position:200% 0}}
header h1::after{content:'_';-webkit-text-fill-color:var(--accent);animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
header .status{margin-left:auto;font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px;font-family:var(--mono);letter-spacing:.06em}
.agent-select{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:13px;outline:none;font-family:var(--mono);margin-left:12px}
header .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

#layout{flex:1;display:flex;flex-direction:column;min-height:0}
#chat-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;border-right:1px solid var(--border)}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-break:break-word;animation:fadeIn .2s ease;border:1px solid transparent}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(167,139,250,.25));color:#eef6ff;border-color:rgba(34,211,238,.4);border-bottom-right-radius:4px;box-shadow:var(--glow)}
.msg.assistant{align-self:flex-start;background:rgba(13,20,38,.88);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:rgba(8,12,24,.92);font-family:var(--mono);font-size:12px;color:var(--accent);border:1px solid rgba(34,211,238,.35);border-radius:8px;max-width:90%}
.msg.error{align-self:center;background:var(--red);color:#fff;font-size:12px;border:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{align-self:flex-start;padding:8px 16px;display:flex;gap:4px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--text2);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-8px);opacity:.3}}
#input-bar{background:linear-gradient(180deg,rgba(13,20,38,.9),rgba(10,15,31,.95));padding:12px 16px;display:flex;gap:10px;border-top:1px solid var(--border);flex-shrink:0}
#input{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:15px;outline:none;resize:none;max-height:120px;font-family:inherit;transition:border-color .15s,box-shadow .15s;caret-color:var(--accent)}
#input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.12),var(--glow)}
#input::placeholder{color:var(--text2)}
#send{background:linear-gradient(135deg,#0e7490,#6d28d9);color:#fff;border:1px solid rgba(34,211,238,.5);border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.05em;transition:transform .1s,opacity .1s,box-shadow .15s}
#send:hover{box-shadow:0 0 16px rgba(34,211,238,.35)}
#send:active{transform:scale(.95)}
#send:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
#cancel{display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer}
.metrics{position:fixed;bottom:80px;right:16px;background:rgba(8,12,24,.92);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);display:none;z-index:10;font-family:var(--mono)}
.metrics.show{display:block}
.approval-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,rgba(245,158,11,.95),rgba(249,115,22,.95));color:#fff;padding:12px 16px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.approval-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.approval-banner .tool-name{font-weight:700;font-size:15px}
.approval-banner .tool-args{font-size:12px;opacity:.9;flex-basis:100%;font-family:var(--mono);background:rgba(0,0,0,.2);padding:6px 10px;border-radius:6px;max-height:60px;overflow:auto}
.approval-banner button{border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer}
.approval-banner .approve-btn{background:#22c55e;color:#fff}
.approval-banner .deny-btn{background:#ef4444;color:#fff}
#editor-panel{display:flex;flex-direction:column;min-height:0;height:48dvh;flex-shrink:0;background:rgba(10,15,31,.95);border-top:1px solid var(--border)}
#editor-toolbar{display:flex;gap:6px;padding:8px;align-items:center;border-bottom:1px solid var(--border);flex-wrap:wrap;background:rgba(13,20,38,.8)}
#file-path{flex:1;min-width:140px;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;outline:none;font-family:var(--mono);caret-color:var(--accent)}
#file-path:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
#file-path::placeholder{color:var(--text2)}
#editor-toolbar button{background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .1s,box-shadow .15s}
#editor-toolbar button:hover{opacity:.85;box-shadow:0 0 10px rgba(34,211,238,.2)}
#editor-toolbar button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
#btn-save{background:linear-gradient(135deg,#059669,#10b981);border-color:rgba(52,211,153,.5)!important;color:#fff}
#btn-zip{background:linear-gradient(135deg,#7c3aed,#a78bfa);border-color:rgba(167,139,250,.5)!important;color:#fff}
#editor-main{flex:1;display:flex;min-height:0}
#explorer{width:240px;flex-shrink:0;border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:rgba(4,7,15,.55)}
#explorer-header{padding:7px 10px;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--text2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;font-family:var(--mono)}
#explorer-header::before{content:'▸';color:var(--accent);margin-right:4px}
#explorer-refresh{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px;line-height:1}
#explorer-refresh:hover{background:var(--surface2);color:var(--accent)}
#explorer-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:1px;min-height:0}
#explorer-empty{padding:10px;font-size:12px;color:var(--text2);line-height:1.5}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:12.5px;font-family:var(--mono);cursor:pointer;white-space:nowrap;color:var(--text2)}
.tree-row:hover{background:var(--surface2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.tree-row.active{background:var(--surface2);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
.tree-row.touched{color:var(--text)}
.tree-row.touched::after{content:'●';color:var(--green);font-size:9px;margin-left:auto;flex-shrink:0;animation:pulse 2s infinite}
.tree-row.pulse{animation:treePulse 1.4s ease}
@keyframes treePulse{0%{background:var(--green);color:#052e16}100%{background:transparent}}
.tree-row .t-ico{flex-shrink:0;opacity:.7}
.tree-row .t-name{overflow:hidden;text-overflow:ellipsis}
#editor-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#file-status{padding:4px 10px;font-size:11px;color:var(--accent);border-bottom:1px solid var(--border);background:rgba(4,7,15,.5);flex-shrink:0;font-family:var(--mono)}
#editor-host{flex:1;min-height:0;overflow:hidden}
#editor-host .CodeMirror{height:100%;font-family:var(--mono);font-size:13px;background:rgba(5,8,16,.9)}
.cm-s-clawrig.CodeMirror{color:#e6f1ff}
.cm-s-clawrig .CodeMirror-gutters{background:rgba(8,12,24,.9);border-right:1px solid var(--border);color:#3b4b66}
.cm-s-clawrig .CodeMirror-linenumber{color:#3f5a80}
.cm-s-clawrig .CodeMirror-cursor{border-left:2px solid var(--accent);box-shadow:0 0 8px var(--accent)}
.cm-s-clawrig .CodeMirror-selected{background:rgba(34,211,238,.15)}
.cm-s-clawrig .CodeMirror-activeline-background{background:rgba(34,211,238,.05)}
.cm-s-clawrig .CodeMirror-matchingbracket{color:#a78bfa!important;background:rgba(167,139,250,.15);outline:1px solid rgba(167,139,250,.4)}
.cm-s-clawrig span.cm-keyword{color:#22d3ee}
.cm-s-clawrig span.cm-string{color:#34d399}
.cm-s-clawrig span.cm-string-2{color:#6ee7b7}
.cm-s-clawrig span.cm-number{color:#f0abfc}
.cm-s-clawrig span.cm-variable{color:#e6f1ff}
.cm-s-clawrig span.cm-variable-2{color:#93c5fd}
.cm-s-clawrig span.cm-variable-3{color:#c4b5fd}
.cm-s-clawrig span.cm-def{color:#7dd3fc}
.cm-s-clawrig span.cm-property{color:#93c5fd}
.cm-s-clawrig span.cm-attribute{color:#fbbf24}
.cm-s-clawrig span.cm-operator{color:#a78bfa}
.cm-s-clawrig span.cm-comment{color:#5b7291;font-style:italic}
.cm-s-clawrig span.cm-tag{color:#f472b6}
.cm-s-clawrig span.cm-type{color:#c4b5fd}
.cm-s-clawrig span.cm-atom{color:#f0abfc}
.cm-s-clawrig span.cm-meta{color:#fbbf24}
.cm-s-clawrig span.cm-qualifier{color:#a5b4fc}
.cm-s-clawrig span.cm-builtin{color:#34d399}
.cm-s-clawrig .CodeMirror-matchingtag{background:rgba(167,139,250,.2)}
#file-toast{position:fixed;bottom:90px;right:16px;background:rgba(8,12,24,.95);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text);display:none;z-index:20;max-width:320px;word-break:break-all;box-shadow:0 4px 20px rgba(0,0,0,.5),var(--glow)}
#file-toast button{margin-left:8px;background:var(--accent);color:#05070f;border:none;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(4,7,15,.6)}
::-webkit-scrollbar-thumb{background:#1d2f4d;border-radius:5px;border:2px solid rgba(4,7,15,.6)}
::-webkit-scrollbar-thumb:hover{background:var(--accent)}
/* Desktop: editor occupies ~80% of the screen, chat is the narrow rail */
@media(min-width:900px){
  #layout{flex-direction:row}
  #chat-col{flex:0 0 20%;max-width:380px;min-width:300px}
  #editor-panel{flex:1;height:auto;min-height:0;border-left:1px solid var(--border);border-top:none}
  #messages{padding:20px 18px}.msg{max-width:100%}
}
/* Mobile: stacked - chat on top, editor below, both fully usable */
@media(max-width:899px){
  #editor-main{flex-direction:column}
  #explorer{width:100%;border-right:none;border-bottom:1px solid var(--border);max-height:140px}
  #explorer-list{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
  #chat-col{min-height:0}
}
</style>
</head>
<body>
<header>
<h1>ClawRig</h1>
<select class="agent-select" id="provider-select" title="Inference provider"><option value="opencode">opencode</option><option value="groq">groq</option></select>
<div class="status" id="status">Connected</div>
</header>
<div id="layout">
<div id="chat-col">
<div id="messages"></div>
<div id="input-bar">
<textarea id="input" rows="1" placeholder="Message ClawRig..." autofocus></textarea>
<button id="cancel" style="display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer">Cancel</button>
<button id="send">Send</button>
</div>
</div>
<div id="editor-panel">
<div id="editor-toolbar">
<input id="file-path" placeholder="path/to/file (workspace root)" spellcheck="false">
<button id="btn-open" title="Open file">Open</button>
<button id="btn-save" title="Save (Ctrl+S)" disabled>Save</button>
<button id="btn-download" title="Download this file">Download</button>
<button id="btn-zip" title="Download all agent-touched files as zip">Zip</button>
</div>
<div id="editor-main">
<div id="explorer">
<div id="explorer-header">FILES<button id="explorer-refresh" title="Refresh file tree">↻</button></div>
<div id="explorer-list"></div>
</div>
<div id="editor-col">
<div id="file-status">No file open</div>
<div id="editor-host"><textarea id="editor" spellcheck="false"></textarea></div>
</div>
</div>
</div>
</div>
<div class="metrics" id="metrics"></div>
<div class="approval-banner" id="approval-banner">
<span class="tool-name" id="approval-tool"></span>
<button class="approve-btn" id="approval-approve">Approve</button>
<button class="deny-btn" id="approval-deny">Deny</button>
<div class="tool-args" id="approval-args"></div>
</div>
<div id="file-toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/rust/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/json/json.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/toml/toml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/dockerfile/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const messages=$('#messages'),input=$('#input'),sendBtn=$('#send'),cancelBtn=$('#cancel'),providerSelect=$('#provider-select'),statusEl=$('#status'),metricsEl=$('#metrics');
let eventSource,agent='main',sending=false;
let currentRunId=null;
let streamBubble=null;
let streamRunId=null;
const approvalBanner=$('#approval-banner');
const approvalTool=$('#approval-tool');
const approvalArgs=$('#approval-args');
const approvalApprove=$('#approval-approve');
const approvalDeny=$('#approval-deny');
let currentApprovalId=null;

const filePathInput=$('#file-path');
const btnOpen=$('#btn-open');
const btnSave=$('#btn-save');
const btnDownload=$('#btn-download');
const btnZip=$('#btn-zip');
const fileStatus=$('#file-status');
const fileToast=$('#file-toast');
const explorerList=$('#explorer-list');
const explorerRefresh=$('#explorer-refresh');
let currentFilePath=null;
let dirty=false;
let touchedPaths=new Set();
let treeFiles=[];
let treeTimer=null;
let toastTimer=null;

const MIMES={
  rs:'text/x-rustsrc',
  js:'text/javascript',mjs:'text/javascript',cjs:'text/javascript',json:'application/json',
  py:'text/x-python',
  sh:'text/x-sh',bash:'text/x-sh',zsh:'text/x-sh',
  toml:'text/x-toml',
  xml:'text/xml',
  html:'text/html',htm:'text/html',
  css:'text/css',
  md:'text/x-markdown',markdown:'text/x-markdown',
  yaml:'text/x-yaml',yml:'text/x-yaml',
  go:'text/x-go',
  c:'text/x-csrc',h:'text/x-csrc',cpp:'text/x-csrc',hpp:'text/x-csrc',java:'text/x-java',cs:'text/x-csharp',
  sql:'text/x-sql',
  dockerfile:'text/x-dockerfile',
  txt:null,log:null
};
function mimeForPath(p){
  const lower=(p||'').toLowerCase();
  if(lower.includes('dockerfile'))return 'text/x-dockerfile';
  const ext=lower.split('.').pop();
  return MIMES[ext]!==undefined?MIMES[ext]:null;
}
function baseName(p){return (p||'').split('/').pop()||'file';}

const editor=CodeMirror.fromTextArea($('#editor'),{
  lineNumbers:true,
  mode:null,
  theme:'clawrig',
  autoCloseBrackets:true,
  matchBrackets:true,
  styleActiveLine:true,
  indentUnit:2,
  tabSize:2,
  lineWrapping:false,
  viewportMargin:Infinity
});
editor.on('change',()=>{if(!dirty){dirty=true;updateSaveBtn();}});

function updateSaveBtn(){btnSave.disabled=!dirty;}
function setFileStatus(s){fileStatus.textContent=s;}
function parseArgs(a){
  if(a===null||a===undefined)return {};
  if(typeof a==='string'){try{return JSON.parse(a)||{}}catch(e){return {}}}
  return (typeof a==='object')?a:{};
}
function showFileToast(msg,action,actionPath){
  clearTimeout(toastTimer);
  fileToast.innerHTML='';
  fileToast.textContent=msg;
  if(action&&actionPath){
    const b=document.createElement('button');
    b.textContent=action;
    b.onclick=()=>{openFile(actionPath);hideFileToast();};
    fileToast.appendChild(b);
  }
  fileToast.style.display='block';
  toastTimer=setTimeout(hideFileToast,5000);
}
function hideFileToast(){fileToast.style.display='none';}

async function loadIntoEditor(path,silent){
  const r=await fetch('/api/file?path='+encodeURIComponent(path));
  if(!r.ok){if(!silent)appendMsg('error',`Failed to load ${path} (HTTP ${r.status})`);return false;}
  const d=await r.json();
  currentFilePath=d.path||path;
  editor.setValue(d.content||'');
  editor.setOption('mode',mimeForPath(currentFilePath));
  editor.refresh();
  filePathInput.value=currentFilePath;
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · ${d.size} bytes`);
  renderTree();
  return true;
}

async function openFile(path){
  path=(path||filePathInput.value).trim();
  if(!path)return;
  if(dirty){
    if(!confirm(`Discard unsaved changes in ${currentFilePath}?`))return;
  }
  await loadIntoEditor(path);
}

async function saveFile(){
  if(!currentFilePath)return;
  const content=editor.getValue();
  const r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentFilePath,content})});
  if(!r.ok){appendMsg('error',`Save failed (HTTP ${r.status})`);return;}
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · saved ${content.length} bytes`);
  touchedPaths.add(currentFilePath);
  refreshTree();
  showFileToast(`💾 Saved ${currentFilePath}`);
}

async function downloadFile(){
  if(!currentFilePath)return;
  if(dirty)await saveFile();
  const blob=new Blob([editor.getValue()],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=baseName(currentFilePath);
  a.click();
  URL.revokeObjectURL(a.href);
}

async function downloadZip(){
  if(typeof JSZip==='undefined'){appendMsg('error','JSZip not loaded (offline?)');return;}
  const zip=new JSZip();
  const names={};
  const add=(p,content)=>{const n=baseName(p);if(names[n]){names[n]++;zip.file(n.replace(/(\.[^.]+)?$/,`-${names[n]}$1`),content);}else{names[n]=1;zip.file(n,content);}};
  if(currentFilePath){
    if(dirty)await saveFile();
    add(currentFilePath,editor.getValue());
  }
  for(const p of touchedPaths){
    if(p===currentFilePath)continue;
    try{
      const r=await fetch('/api/file?path='+encodeURIComponent(p));
      if(r.ok){const d=await r.json();add(d.path||p,d.content||'');}
    }catch(e){}
  }
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='clawrig-code-'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip';
  a.click();
  URL.revokeObjectURL(a.href);
  showFileToast('📦 Downloading zip');
}

function refreshTree(){
  clearTimeout(treeTimer);
  treeTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/files');
      if(!r.ok)return;
      const d=await r.json();
      treeFiles=(d.files||[]).map(f=>f.path).filter(Boolean);
      renderTree();
    }catch(e){}
  },300);
}

function treeRowFor(path){
  return explorerList.querySelector(`.tree-row[data-path="${CSS.escape(path)}"]`);
}

function renderTree(){
  explorerList.innerHTML='';
  if(treeFiles.length===0){
    const empty=document.createElement('div');
    empty.id='explorer-empty';
    empty.textContent='No files yet — files the agent creates appear here.';
    explorerList.appendChild(empty);
    return;
  }
  for(const path of treeFiles){
    const depth=path.split('/').length-1;
    const row=document.createElement('div');
    row.className='tree-row'+(touchedPaths.has(path)?' touched':'');
    if(path===currentFilePath)row.classList.add('active');
    row.dataset.path=path;
    row.title=path;
    const ico=document.createElement('span');
    ico.className='t-ico';
    ico.textContent='📄';
    const name=document.createElement('span');
    name.className='t-name';
    name.textContent=baseName(path);
    row.style.paddingLeft=(8+depth*14)+'px';
    row.appendChild(ico);
    row.appendChild(name);
    row.onclick=()=>openFile(path);
    explorerList.appendChild(row);
  }
}

function pulseFile(path){
  const row=treeRowFor(path);
  if(!row)return;
  row.classList.remove('pulse');
  void row.offsetWidth;
  row.classList.add('pulse');
  setTimeout(()=>row.classList.remove('pulse'),1500);
}

async function agentFileChanged(path){
  if(!path)return;
  touchedPaths.add(path);
  refreshTree();
  if(path===currentFilePath){
    if(dirty){
      showFileToast('⚠️ Unsaved changes — agent changed '+path,'Open',path);
      return;
    }
    const ok=await loadIntoEditor(path,true);
    if(ok)showFileToast('↻ Agent updated '+path);
  }else if(currentFilePath===null&&editor.getValue()===''){
    await loadIntoEditor(path,true);
    pulseFile(path);
  }else{
    pulseFile(path);
    showFileToast('🧑💻 Agent wrote '+path,'Open',path);
  }
}

async function init(){
  connectSSE();
  refreshTree();
  updateMetrics();
  setInterval(updateMetrics,30000);
}

function connectSSE(){
  if(eventSource)eventSource.close();
  eventSource=new EventSource('/api/events');
  eventSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='tool_call'){
        const a=parseArgs(d.args);
        const where=(a&&a.path)?a.path:(d.path||'');
        appendMsg('tool',`🔧 ${d.name}${where?' '+where:''}`);
      }
      if(d.type==='tool_result'){
        const mark=d.ok===false?'❌':'✅';
        const short=(d.result||'').replace(/\s+/g,' ').slice(0,100);
        appendMsg('tool',`${mark} ${d.name}${d.path?' '+d.path:''}${d.ok===false&&short?` — ${short}`:''}`);
        if(d.name==='write_file'||d.name==='edit_file'||d.name==='delete_file'){
          if(d.name==='delete_file'){
            touchedPaths.delete(d.path);
            if(d.path===currentFilePath){
              currentFilePath=null;
              editor.setValue('');
              editor.setOption('mode',null);
              dirty=false;updateSaveBtn();
              setFileStatus('No file open');
            }
            refreshTree();
          }else{
            setTimeout(()=>agentFileChanged(d.path),250);
          }
        }
      }
      if(d.type==='session.token'){
        // Stream tokens into a live assistant bubble for this run
        if(d.run_id&&d.run_id!==streamRunId){
          streamRunId=d.run_id;
          const div=document.createElement('div');
          div.className='msg assistant';div.id='stream-bubble';
          messages.appendChild(div);
          messages.scrollTop=messages.scrollHeight;
          streamBubble=div;
          hideTyping();
        }
        if(streamBubble){
          streamBubble.textContent+=d.token;
          messages.scrollTop=messages.scrollHeight;
        }
      }
      if(d.type==='session.token_reset'&&streamBubble){
        // Retry in progress - clear the partial stream
        streamBubble.textContent='';
      }
      if(d.type==='agent_response'&&d.agent===agent){
        hideTyping();
        refreshTree();
        if(!streamBubble||streamBubble.id!=='stream-bubble'||d.run_id!==streamRunId){
          // No streaming happened (or this run's bubble was closed) - show full response
          appendMsg('assistant',d.content||'');
        }else{
          // Streamed tokens already rendered; ensure bubble finalized
          if(d.content)streamBubble.textContent=d.content;
          streamBubble=null;streamRunId=null;
        }
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='run_cancelled'||d.type==='run_error'){
        if(streamBubble&&d.run_id===streamRunId){streamBubble.textContent+='\n⛔ Run '+(d.type==='run_cancelled'?'cancelled':'failed')+'.';streamBubble=null;streamRunId=null;}
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='approval_needed'){
        currentApprovalId=d.approval_id;
        approvalTool.textContent=`⚙️ ${d.tool}`;
        approvalArgs.textContent=typeof d.arguments==='string'?d.arguments:JSON.stringify(d.arguments,null,2);
        approvalBanner.classList.add('show');
        hideTyping();
      }
    }catch(ex){}
  };
  eventSource.onerror=()=>{
    statusEl.textContent='Reconnecting...';
    statusEl.style.color='var(--red)';
    setTimeout(connectSSE,3000);
  };
  eventSource.onopen=()=>{
    statusEl.textContent='Connected';
    statusEl.style.color='var(--green)';
  };
}

function appendMsg(role,content){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=content;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='typing';div.id='typing';
  div.innerHTML='<span></span><span></span><span></span>';
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function hideTyping(){
  const t=$('#typing');if(t)t.remove();
}

async function send(){
  if(sending||!input.value.trim())return;
  sending=true;sendBtn.disabled=true;cancelBtn.style.display='inline-block';
  const msg=input.value.trim();input.value='';input.style.height='auto';
  appendMsg('user',msg);showTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,agent,peer_id:'web-user',provider:providerSelect.value})});
    const d=await r.json();
    currentRunId=d.run_id||null;
    if(!d.run_id){
      hideTyping();
      appendMsg('assistant',d.response||'');
      finishRun();
    }
  }catch(e){hideTyping();appendMsg('error','Failed to send message');finishRun();}
}

function finishRun(){
  sending=false;sendBtn.disabled=false;cancelBtn.style.display='none';
  currentRunId=null;input.focus();
}

async function cancelRun(){
  if(!currentRunId)return;
  try{
    await fetch(`/api/tasks/${currentRunId}/cancel`,{method:'POST'});
  }catch(e){appendMsg('error','Failed to cancel run');}
}

async function updateMetrics(){
  try{
    const r=await fetch('/api/metrics');const d=await r.json();
    metricsEl.textContent=`PID:${d.pid} Mem:${d.memory_kb||'?'}KB`;
    metricsEl.classList.add('show');
  }catch(e){}
}

async function handleApproval(approved){
  if(!currentApprovalId)return;
  const url=approved?'/api/approve':'/api/deny';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:currentApprovalId})});
    appendMsg('tool',approved?'✅ Approved':'❌ Denied');
  }catch(e){appendMsg('error','Failed to send approval');}
  approvalBanner.classList.remove('show');
  currentApprovalId=null;
}

approvalApprove.onclick=()=>handleApproval(true);
approvalDeny.onclick=()=>handleApproval(false);

sendBtn.onclick=send;
cancelBtn.onclick=cancelRun;
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';};
btnOpen.onclick=()=>openFile();
btnSave.onclick=saveFile;
btnDownload.onclick=downloadFile;
btnZip.onclick=downloadZip;
explorerRefresh.onclick=refreshTree;
filePathInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openFile();}};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    if(currentFilePath)saveFile();
  }
});
init();
</script>
