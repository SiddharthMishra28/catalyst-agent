<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ClawRig</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/theme/material-darker.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0f172a;--surface:#1e293b;--surface2:#334155;--text:#f8fafc;--text2:#94a3b8;--accent:#38bdf8;--accent2:#818cf8;--green:#34d399;--red:#f87171;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--surface);padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--surface2);flex-shrink:0}
header h1{font-size:18px;font-weight:600;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
header .status{margin-left:auto;font-size:12px;color:var(--green);display:flex;align-items:center;gap:6px}
header .status::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.agent-select{background:var(--surface2);color:var(--text);border:1px solid var(--surface2);border-radius:8px;padding:6px 10px;font-size:13px;outline:none}
#layout{flex:1;display:flex;flex-direction:column;min-height:0}
#chat-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#messages{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;scroll-behavior:smooth}
.msg{max-width:85%;padding:12px 16px;border-radius:var(--radius);font-size:14px;line-height:1.5;word-break:break-word;animation:fadeIn .2s ease}
.msg.user{align-self:flex-end;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border-bottom-right-radius:4px}
.msg.assistant{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.tool{align-self:flex-start;background:var(--surface2);font-family:monospace;font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:8px;max-width:90%}
.msg.error{align-self:center;background:var(--red);color:#fff;font-size:12px}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.typing{align-self:flex-start;padding:8px 16px;display:flex;gap:4px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--text2);animation:bounce .6s infinite alternate}
.typing span:nth-child(2){animation-delay:.2s}
.typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce{to{transform:translateY(-8px);opacity:.3}}
#input-bar{background:var(--surface);padding:12px 16px;display:flex;gap:10px;border-top:1px solid var(--surface2);flex-shrink:0}
#input{flex:1;background:var(--surface2);color:var(--text);border:none;border-radius:var(--radius);padding:12px 16px;font-size:15px;outline:none;resize:none;max-height:120px;font-family:inherit}
#input::placeholder{color:var(--text2)}
#send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer;transition:transform .1s,opacity .1s}
#send:active{transform:scale(.95)}
#send:disabled{opacity:.5;cursor:not-allowed}
.metrics{position:fixed;bottom:80px;right:16px;background:var(--surface);border:1px solid var(--surface2);border-radius:8px;padding:8px 12px;font-size:11px;color:var(--text2);display:none;z-index:10}
.metrics.show{display:block}
.approval-banner{position:fixed;top:0;left:0;right:0;background:linear-gradient(135deg,#f59e0b,#f97316);color:#fff;padding:12px 16px;z-index:100;display:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
.approval-banner.show{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.approval-banner .tool-name{font-weight:700;font-size:15px}
.approval-banner .tool-args{font-size:12px;opacity:.9;flex-basis:100%;font-family:monospace;background:rgba(0,0,0,.2);padding:6px 10px;border-radius:6px;max-height:60px;overflow:auto}
.approval-banner button{border:none;border-radius:8px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer}
.approval-banner .approve-btn{background:#22c55e;color:#fff}
.approval-banner .deny-btn{background:#ef4444;color:#fff}
#editor-panel{display:flex;flex-direction:column;min-height:40dvh;height:40dvh;flex-shrink:0;background:var(--surface);border-top:1px solid var(--surface2)}
#editor-toolbar{display:flex;gap:6px;padding:8px;align-items:center;border-bottom:1px solid var(--surface2);flex-wrap:wrap}
#file-path{flex:1;min-width:140px;background:var(--surface2);color:var(--text);border:none;border-radius:8px;padding:8px 12px;font-size:13px;outline:none;font-family:monospace}
#file-path::placeholder{color:var(--text2)}
#editor-toolbar button{background:var(--surface2);color:var(--text);border:none;border-radius:8px;padding:8px 12px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .1s}
#editor-toolbar button:hover{opacity:.85}
#editor-toolbar button:disabled{opacity:.4;cursor:not-allowed}
#btn-save{background:linear-gradient(135deg,var(--green),#10b981);color:#fff}
#editor-main{flex:1;display:flex;min-height:0}
#explorer{width:240px;flex-shrink:0;border-right:1px solid var(--surface2);display:flex;flex-direction:column;min-height:0;background:rgba(0,0,0,.15)}
#explorer-header{padding:7px 10px;font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--text2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--surface2);flex-shrink:0}
#explorer-refresh{background:none;border:none;color:var(--text2);cursor:pointer;font-size:13px;padding:2px 6px;border-radius:6px;line-height:1}
#explorer-refresh:hover{background:var(--surface2);color:var(--text)}
#explorer-list{flex:1;overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:1px;min-height:0}
#explorer-empty{padding:10px;font-size:12px;color:var(--text2);line-height:1.5}
.tree-row{display:flex;align-items:center;gap:6px;padding:4px 8px;border-radius:6px;font-size:12.5px;font-family:ui-monospace,Consolas,monospace;cursor:pointer;white-space:nowrap;color:var(--text2)}
.tree-row:hover{background:var(--surface2);color:var(--text)}
.tree-row.active{background:var(--surface2);color:var(--accent)}
.tree-row.touched{color:var(--text)}
.tree-row.touched::after{content:'●';color:var(--green);font-size:9px;margin-left:auto;flex-shrink:0;animation:pulse 2s infinite}
.tree-row.pulse{animation:treePulse 1.4s ease}
@keyframes treePulse{0%{background:var(--green);color:#052e16}100%{background:transparent}}
.tree-row .t-ico{flex-shrink:0;opacity:.7}
.tree-row .t-name{overflow:hidden;text-overflow:ellipsis}
#editor-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#file-status{padding:4px 10px;font-size:11px;color:var(--text2);border-bottom:1px solid var(--surface2);background:rgba(0,0,0,.2);flex-shrink:0}
#editor-host{flex:1;min-height:0;overflow:hidden}
#editor-host .CodeMirror{height:100%;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}
#file-toast{position:fixed;bottom:90px;right:16px;background:var(--surface);border:1px solid var(--accent);border-radius:8px;padding:8px 14px;font-size:12px;color:var(--text);display:none;z-index:20;max-width:320px;word-break:break-all;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#file-toast button{margin-left:8px;background:var(--accent);color:#0f172a;border:none;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;cursor:pointer}
@media(min-width:900px){
  #layout{flex-direction:row}
  #editor-panel{height:auto;min-height:0;flex:1 1 45%;max-width:50%;border-left:1px solid var(--surface2);border-top:none}
  #messages{padding:24px 32px}.msg{max-width:60%}
}
@media(max-width:899px){
  #editor-main{flex-direction:column}
  #explorer{width:100%;border-right:none;border-bottom:1px solid var(--surface2);max-height:150px}
  #explorer-list{flex-direction:row;flex-wrap:wrap;align-content:flex-start}
}
</style>
</head>
<body>
<header>
<h1>ClawRig</h1>
<select class="agent-select" id="agent-select"><option value="main">main</option></select>
<div class="status" id="status">Connected</div>
</header>
<div id="layout">
<div id="chat-col">
<div id="messages"></div>
<div id="input-bar">
<textarea id="input" rows="1" placeholder="Message ClawRig..." autofocus></textarea>
<button id="cancel" style="display:none;background:var(--red);color:#fff;border:none;border-radius:var(--radius);padding:12px 20px;font-size:15px;font-weight:600;cursor:pointer">Cancel</button>
<button id="send">Send</button>
</div>
</div>
<div id="editor-panel">
<div id="editor-toolbar">
<input id="file-path" placeholder="path/to/file (workspace root)" spellcheck="false">
<button id="btn-open" title="Open file">Open</button>
<button id="btn-save" title="Save (Ctrl+S)" disabled>Save</button>
<button id="btn-download" title="Download this file">Download</button>
<button id="btn-zip" title="Download all agent-touched files as zip">Zip</button>
</div>
<div id="editor-main">
<div id="explorer">
<div id="explorer-header">FILES<button id="explorer-refresh" title="Refresh file tree">↻</button></div>
<div id="explorer-list"></div>
</div>
<div id="editor-col">
<div id="file-status">No file open</div>
<div id="editor-host"><textarea id="editor" spellcheck="false"></textarea></div>
</div>
</div>
</div>
</div>
<div class="metrics" id="metrics"></div>
<div class="approval-banner" id="approval-banner">
<span class="tool-name" id="approval-tool"></span>
<button class="approve-btn" id="approval-approve">Approve</button>
<button class="deny-btn" id="approval-deny">Deny</button>
<div class="tool-args" id="approval-args"></div>
</div>
<div id="file-toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/rust/rust.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/python/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/shell/shell.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/toml/toml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/xml/xml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/css/css.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/htmlmixed/htmlmixed.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/markdown/markdown.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/yaml/yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/go/go.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/sql/sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/mode/dockerfile/dockerfile.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/addon/selection/active-line.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const messages=$('#messages'),input=$('#input'),sendBtn=$('#send'),cancelBtn=$('#cancel'),agentSelect=$('#agent-select'),statusEl=$('#status'),metricsEl=$('#metrics');
let eventSource,agent='main',sending=false;
let currentRunId=null;
let streamBubble=null;
let streamRunId=null;
const approvalBanner=$('#approval-banner');
const approvalTool=$('#approval-tool');
const approvalArgs=$('#approval-args');
const approvalApprove=$('#approval-approve');
const approvalDeny=$('#approval-deny');
let currentApprovalId=null;

const filePathInput=$('#file-path');
const btnOpen=$('#btn-open');
const btnSave=$('#btn-save');
const btnDownload=$('#btn-download');
const btnZip=$('#btn-zip');
const fileStatus=$('#file-status');
const fileToast=$('#file-toast');
const explorerList=$('#explorer-list');
const explorerRefresh=$('#explorer-refresh');
let currentFilePath=null;
let dirty=false;
let touchedPaths=new Set();
let treeFiles=[];
let treeTimer=null;
let toastTimer=null;

const MIMES={
  rs:'text/x-rustsrc',
  js:'text/javascript',mjs:'text/javascript',cjs:'text/javascript',json:'application/json',
  py:'text/x-python',
  sh:'text/x-sh',bash:'text/x-sh',zsh:'text/x-sh',
  toml:'text/x-toml',
  xml:'text/xml',
  html:'text/html',htm:'text/html',
  css:'text/css',
  md:'text/x-markdown',markdown:'text/x-markdown',
  yaml:'text/x-yaml',yml:'text/x-yaml',
  go:'text/x-go',
  c:'text/x-csrc',h:'text/x-csrc',cpp:'text/x-csrc',hpp:'text/x-csrc',java:'text/x-java',cs:'text/x-csharp',
  sql:'text/x-sql',
  dockerfile:'text/x-dockerfile',
  txt:null,log:null
};
function mimeForPath(p){
  const lower=(p||'').toLowerCase();
  if(lower.includes('dockerfile'))return 'text/x-dockerfile';
  const ext=lower.split('.').pop();
  return MIMES[ext]!==undefined?MIMES[ext]:null;
}
function baseName(p){return (p||'').split('/').pop()||'file';}

const editor=CodeMirror.fromTextArea($('#editor'),{
  lineNumbers:true,
  mode:null,
  theme:'material-darker',
  autoCloseBrackets:true,
  matchBrackets:true,
  styleActiveLine:true,
  indentUnit:2,
  tabSize:2,
  lineWrapping:false,
  viewportMargin:Infinity
});
editor.on('change',()=>{if(!dirty){dirty=true;updateSaveBtn();}});

function updateSaveBtn(){btnSave.disabled=!dirty;}
function setFileStatus(s){fileStatus.textContent=s;}
function parseArgs(a){
  if(a===null||a===undefined)return {};
  if(typeof a==='string'){try{return JSON.parse(a)||{}}catch(e){return {}}}
  return (typeof a==='object')?a:{};
}
function showFileToast(msg,action,actionPath){
  clearTimeout(toastTimer);
  fileToast.innerHTML='';
  fileToast.textContent=msg;
  if(action&&actionPath){
    const b=document.createElement('button');
    b.textContent=action;
    b.onclick=()=>{openFile(actionPath);hideFileToast();};
    fileToast.appendChild(b);
  }
  fileToast.style.display='block';
  toastTimer=setTimeout(hideFileToast,5000);
}
function hideFileToast(){fileToast.style.display='none';}

async function loadIntoEditor(path,silent){
  const r=await fetch('/api/file?path='+encodeURIComponent(path));
  if(!r.ok){if(!silent)appendMsg('error',`Failed to load ${path} (HTTP ${r.status})`);return false;}
  const d=await r.json();
  currentFilePath=d.path||path;
  editor.setValue(d.content||'');
  editor.setOption('mode',mimeForPath(currentFilePath));
  editor.refresh();
  filePathInput.value=currentFilePath;
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · ${d.size} bytes`);
  renderTree();
  return true;
}

async function openFile(path){
  path=(path||filePathInput.value).trim();
  if(!path)return;
  if(dirty){
    if(!confirm(`Discard unsaved changes in ${currentFilePath}?`))return;
  }
  await loadIntoEditor(path);
}

async function saveFile(){
  if(!currentFilePath)return;
  const content=editor.getValue();
  const r=await fetch('/api/file',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:currentFilePath,content})});
  if(!r.ok){appendMsg('error',`Save failed (HTTP ${r.status})`);return;}
  dirty=false;updateSaveBtn();
  setFileStatus(`${currentFilePath} · saved ${content.length} bytes`);
  touchedPaths.add(currentFilePath);
  refreshTree();
  showFileToast(`💾 Saved ${currentFilePath}`);
}

async function downloadFile(){
  if(!currentFilePath)return;
  if(dirty)await saveFile();
  const blob=new Blob([editor.getValue()],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=baseName(currentFilePath);
  a.click();
  URL.revokeObjectURL(a.href);
}

async function downloadZip(){
  if(typeof JSZip==='undefined'){appendMsg('error','JSZip not loaded (offline?)');return;}
  const zip=new JSZip();
  const names={};
  const add=(p,content)=>{const n=baseName(p);if(names[n]){names[n]++;zip.file(n.replace(/(\.[^.]+)?$/,`-${names[n]}$1`),content);}else{names[n]=1;zip.file(n,content);}};
  if(currentFilePath){
    if(dirty)await saveFile();
    add(currentFilePath,editor.getValue());
  }
  for(const p of touchedPaths){
    if(p===currentFilePath)continue;
    try{
      const r=await fetch('/api/file?path='+encodeURIComponent(p));
      if(r.ok){const d=await r.json();add(d.path||p,d.content||'');}
    }catch(e){}
  }
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='clawrig-code-'+new Date().toISOString().replace(/[:.]/g,'-')+'.zip';
  a.click();
  URL.revokeObjectURL(a.href);
  showFileToast('📦 Downloading zip');
}

function refreshTree(){
  clearTimeout(treeTimer);
  treeTimer=setTimeout(async()=>{
    try{
      const r=await fetch('/api/files');
      if(!r.ok)return;
      const d=await r.json();
      treeFiles=(d.files||[]).map(f=>f.path).filter(Boolean);
      renderTree();
    }catch(e){}
  },300);
}

function treeRowFor(path){
  return explorerList.querySelector(`.tree-row[data-path="${CSS.escape(path)}"]`);
}

function renderTree(){
  explorerList.innerHTML='';
  if(treeFiles.length===0){
    const empty=document.createElement('div');
    empty.id='explorer-empty';
    empty.textContent='No files yet — files the agent creates appear here.';
    explorerList.appendChild(empty);
    return;
  }
  for(const path of treeFiles){
    const depth=path.split('/').length-1;
    const row=document.createElement('div');
    row.className='tree-row'+(touchedPaths.has(path)?' touched':'');
    if(path===currentFilePath)row.classList.add('active');
    row.dataset.path=path;
    row.title=path;
    const ico=document.createElement('span');
    ico.className='t-ico';
    ico.textContent='📄';
    const name=document.createElement('span');
    name.className='t-name';
    name.textContent=baseName(path);
    row.style.paddingLeft=(8+depth*14)+'px';
    row.appendChild(ico);
    row.appendChild(name);
    row.onclick=()=>openFile(path);
    explorerList.appendChild(row);
  }
}

function pulseFile(path){
  const row=treeRowFor(path);
  if(!row)return;
  row.classList.remove('pulse');
  void row.offsetWidth;
  row.classList.add('pulse');
  setTimeout(()=>row.classList.remove('pulse'),1500);
}

async function agentFileChanged(path){
  if(!path)return;
  touchedPaths.add(path);
  refreshTree();
  if(path===currentFilePath){
    if(dirty){
      showFileToast('⚠️ Unsaved changes — agent changed '+path,'Open',path);
      return;
    }
    const ok=await loadIntoEditor(path,true);
    if(ok)showFileToast('↻ Agent updated '+path);
  }else if(currentFilePath===null&&editor.getValue()===''){
    await loadIntoEditor(path,true);
    pulseFile(path);
  }else{
    pulseFile(path);
    showFileToast('🧑💻 Agent wrote '+path,'Open',path);
  }
}

async function init(){
  try{
    const r=await fetch('/api/agents');
    const agents=await r.json();
    agentSelect.innerHTML=agents.map(a=>`<option value="${a}">${a}</option>`).join('');
  }catch(e){}
  connectSSE();
  refreshTree();
  updateMetrics();
  setInterval(updateMetrics,30000);
}

function connectSSE(){
  if(eventSource)eventSource.close();
  eventSource=new EventSource('/api/events');
  eventSource.onmessage=e=>{
    try{
      const d=JSON.parse(e.data);
      if(d.type==='tool_call'){
        const a=parseArgs(d.args);
        const where=(a&&a.path)?a.path:(d.path||'');
        appendMsg('tool',`🔧 ${d.name}${where?' '+where:''}`);
      }
      if(d.type==='tool_result'){
        const mark=d.ok===false?'❌':'✅';
        const short=(d.result||'').replace(/\s+/g,' ').slice(0,100);
        appendMsg('tool',`${mark} ${d.name}${d.path?' '+d.path:''}${d.ok===false&&short?` — ${short}`:''}`);
        if(d.name==='write_file'||d.name==='edit_file'||d.name==='delete_file'){
          if(d.name==='delete_file'){
            touchedPaths.delete(d.path);
            if(d.path===currentFilePath){
              currentFilePath=null;
              editor.setValue('');
              editor.setOption('mode',null);
              dirty=false;updateSaveBtn();
              setFileStatus('No file open');
            }
            refreshTree();
          }else{
            setTimeout(()=>agentFileChanged(d.path),250);
          }
        }
      }
      if(d.type==='session.token'){
        // Stream tokens into a live assistant bubble for this run
        if(d.run_id&&d.run_id!==streamRunId){
          streamRunId=d.run_id;
          const div=document.createElement('div');
          div.className='msg assistant';div.id='stream-bubble';
          messages.appendChild(div);
          messages.scrollTop=messages.scrollHeight;
          streamBubble=div;
          hideTyping();
        }
        if(streamBubble){
          streamBubble.textContent+=d.token;
          messages.scrollTop=messages.scrollHeight;
        }
      }
      if(d.type==='session.token_reset'&&streamBubble){
        // Retry in progress - clear the partial stream
        streamBubble.textContent='';
      }
      if(d.type==='agent_response'&&d.agent===agent){
        hideTyping();
        refreshTree();
        if(!streamBubble||streamBubble.id!=='stream-bubble'||d.run_id!==streamRunId){
          // No streaming happened (or this run's bubble was closed) - show full response
          appendMsg('assistant',d.content||'');
        }else{
          // Streamed tokens already rendered; ensure bubble finalized
          if(d.content)streamBubble.textContent=d.content;
          streamBubble=null;streamRunId=null;
        }
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='run_cancelled'||d.type==='run_error'){
        if(streamBubble&&d.run_id===streamRunId){streamBubble.textContent+='\n⛔ Run '+(d.type==='run_cancelled'?'cancelled':'failed')+'.';streamBubble=null;streamRunId=null;}
        if(d.run_id===currentRunId)finishRun();
      }
      if(d.type==='approval_needed'){
        currentApprovalId=d.approval_id;
        approvalTool.textContent=`⚙️ ${d.tool}`;
        approvalArgs.textContent=typeof d.arguments==='string'?d.arguments:JSON.stringify(d.arguments,null,2);
        approvalBanner.classList.add('show');
        hideTyping();
      }
    }catch(ex){}
  };
  eventSource.onerror=()=>{
    statusEl.textContent='Reconnecting...';
    statusEl.style.color='var(--red)';
    setTimeout(connectSSE,3000);
  };
  eventSource.onopen=()=>{
    statusEl.textContent='Connected';
    statusEl.style.color='var(--green)';
  };
}

function appendMsg(role,content){
  const div=document.createElement('div');
  div.className='msg '+role;
  div.textContent=content;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function showTyping(){
  const div=document.createElement('div');
  div.className='typing';div.id='typing';
  div.innerHTML='<span></span><span></span><span></span>';
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function hideTyping(){
  const t=$('#typing');if(t)t.remove();
}

async function send(){
  if(sending||!input.value.trim())return;
  sending=true;sendBtn.disabled=true;cancelBtn.style.display='inline-block';
  const msg=input.value.trim();input.value='';input.style.height='auto';
  appendMsg('user',msg);showTyping();
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,agent,peer_id:'web-user'})});
    const d=await r.json();
    currentRunId=d.run_id||null;
    if(!d.run_id){
      hideTyping();
      appendMsg('assistant',d.response||'');
      finishRun();
    }
  }catch(e){hideTyping();appendMsg('error','Failed to send message');finishRun();}
}

function finishRun(){
  sending=false;sendBtn.disabled=false;cancelBtn.style.display='none';
  currentRunId=null;input.focus();
}

async function cancelRun(){
  if(!currentRunId)return;
  try{
    await fetch(`/api/tasks/${currentRunId}/cancel`,{method:'POST'});
  }catch(e){appendMsg('error','Failed to cancel run');}
}

async function updateMetrics(){
  try{
    const r=await fetch('/api/metrics');const d=await r.json();
    metricsEl.textContent=`PID:${d.pid} Mem:${d.memory_kb||'?'}KB`;
    metricsEl.classList.add('show');
  }catch(e){}
}

async function handleApproval(approved){
  if(!currentApprovalId)return;
  const url=approved?'/api/approve':'/api/deny';
  try{
    await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:currentApprovalId})});
    appendMsg('tool',approved?'✅ Approved':'❌ Denied');
  }catch(e){appendMsg('error','Failed to send approval');}
  approvalBanner.classList.remove('show');
  currentApprovalId=null;
}

approvalApprove.onclick=()=>handleApproval(true);
approvalDeny.onclick=()=>handleApproval(false);

agentSelect.onchange=e=>{agent=e.target.value;messages.innerHTML='';};
sendBtn.onclick=send;
cancelBtn.onclick=cancelRun;
input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
input.oninput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,120)+'px';};
btnOpen.onclick=()=>openFile();
btnSave.onclick=saveFile;
btnDownload.onclick=downloadFile;
btnZip.onclick=downloadZip;
explorerRefresh.onclick=refreshTree;
filePathInput.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();openFile();}};
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
    e.preventDefault();
    if(currentFilePath)saveFile();
  }
});
init();
</script>
