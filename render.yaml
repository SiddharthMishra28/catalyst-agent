services:
  - type: web
    name: glyph
    runtime: docker
    repo: https://github.com/SiddharthMishra28/catalyst-agent
    branch: feature/codemirror-editor
    plan: free
    autoDeploy: true
    healthCheckPath: /api/health
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: GROQ_API_KEY
        sync: false